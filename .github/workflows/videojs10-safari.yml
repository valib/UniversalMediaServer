name: Safari HLS compatibility
on:
  push:
    branches: ['migration/videojs-10-hls-check']
    paths:
      - 'react-client/**'
      - 'src/main/**'
      - '.github/workflows/videojs10-safari.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari:
    name: Safari (${{ matrix.platform }}, ${{ matrix.engine }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        platform: [macos, ios]
        engine: [native, mse]
        include:
          - os: macos-26
            platform: macos
            engine: native
          - os: macos-26
            platform: macos
            engine: mse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare native media dependencies
        run: brew install ffmpeg libmediainfo
      - name: Install simulator touch input
        if: matrix.platform == 'ios'
        run: brew install cameroncooke/axe/axe
      - name: Build server and resolve the Java runtime classpath
        run: mvn -B -P testing-macos -DskipTests compile dependency:build-classpath -Dmdep.outputFile=target/safari-classpath
      - name: Build web client for the UMS web server
        working-directory: react-client
        run: |
          node .yarn/releases/yarn-*.cjs install --immutable
          node .yarn/releases/yarn-*.cjs build
          node .yarn/releases/yarn-*.cjs build:videojs10
      - name: Play the UMS sample in Safari
        run: bash react-client/compat/videojs10/safari/ci-server.sh "${{ matrix.platform }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-${{ matrix.platform }}-${{ matrix.engine }}-${{ matrix.os }}-results
          path: react-client/test-results/safari-${{ matrix.platform }}/

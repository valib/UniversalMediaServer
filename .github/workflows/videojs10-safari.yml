name: Safari HLS compatibility
on:
  push:
    branches:
      - 'migration/videojs-10-hls-check'
      - 'migration/videojs-10-hls-check-clean'
      - 'migration/videojs-10-ci-review'
      - 'migration/videojs-10-ci-candidate'
      - 'migration/videojs-10-arm-check-c4ea768'
    paths:
      - 'react-client/**'
      - 'src/main/**'
      - '.github/workflows/videojs10-safari.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari:
    name: Safari (${{ matrix.platform }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos, os: macos-26 }
    steps:
      - uses: actions/checkout@v4
      - name: Inspect the ARM runner and its media devices
        run: |
          uname -m
          test "$(uname -m)" = arm64
          system_profiler SPAudioDataType SPDisplaysDataType
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start the iPhone simulator
        if: matrix.platform == 'ios'
        env:
          IOS_SIMULATOR_MAJOR: '18'
        run: |
          udid=$(bash react-client/compat/videojs10/safari/boot-simulator.sh --start)
          echo "IOS_SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Prepare native media dependencies
        run: brew install ffmpeg libmediainfo
      - name: Build server and resolve the Java runtime classpath
        run: mvn -B -P testing-macos -DskipTests compile dependency:build-classpath -Dmdep.outputFile=target/safari-classpath
      - name: Build web client for the UMS web server
        id: client
        working-directory: react-client
        run: |
          node .yarn/releases/yarn-*.cjs install --immutable
          node .yarn/releases/yarn-*.cjs build
          node .yarn/releases/yarn-*.cjs build:videojs10
      - name: Play the sample with native HLS on macOS
        if: matrix.platform == 'macos'
        timeout-minutes: 15
        run: bash react-client/compat/videojs10/safari/ci-server.sh macos native
      - name: Play the sample with hls.js (MSE) on macOS
        if: ${{ !cancelled() && matrix.platform == 'macos' && steps.client.outcome == 'success' }}
        timeout-minutes: 15
        run: bash react-client/compat/videojs10/safari/ci-server.sh macos mse
      - name: Wait for the iPhone and install touch input
        id: simulator
        if: ${{ !cancelled() && matrix.platform == 'ios' && steps.client.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          brew install cameroncooke/axe/axe
          bash react-client/compat/videojs10/safari/boot-simulator.sh
      - name: Play the sample with native HLS on iPhone
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        timeout-minutes: 15
        run: bash react-client/compat/videojs10/safari/ci-server.sh ios native
      - name: Play the sample with hls.js (MSE) on iPhone
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        timeout-minutes: 15
        run: bash react-client/compat/videojs10/safari/ci-server.sh ios mse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-${{ matrix.platform }}-${{ matrix.os }}-results
          path: react-client/test-results/safari-*/

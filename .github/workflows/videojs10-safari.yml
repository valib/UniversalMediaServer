name: Safari HLS compatibility
on:
  push:
    branches: ['migration/videojs-10-hls-check']
    paths:
      - 'react-client/**'
      - 'src/main/**'
      - '.github/workflows/videojs10-safari.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari:
    name: Safari (${{ matrix.platform }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos
          - os: macos-15-intel
            platform: ios
          - os: macos-26
            platform: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare native media dependencies
        run: brew install ffmpeg libmediainfo
      - name: Install simulator touch input
        if: matrix.platform == 'ios'
        run: brew install cameroncooke/axe/axe
      - name: Build server and resolve the Java runtime classpath
        run: mvn -B -P testing-macos -DskipTests compile dependency:build-classpath -Dmdep.outputFile=target/safari-classpath
      - name: Build web client for the UMS web server
        id: client
        working-directory: react-client
        run: |
          node .yarn/releases/yarn-*.cjs install --immutable
          node .yarn/releases/yarn-*.cjs build
          node .yarn/releases/yarn-*.cjs build:videojs10
      - name: Boot the iPhone and launch Mobile Safari
        id: simulator
        if: matrix.platform == 'ios'
        timeout-minutes: 20
        run: |
          udid=$(bash react-client/compat/videojs10/safari/boot-simulator.sh)
          echo "IOS_SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Play the sample with native HLS
        timeout-minutes: 15
        run: bash react-client/compat/videojs10/safari/ci-server.sh "${{ matrix.platform }}" native
      - name: Play the sample with hls.js (MSE)
        if: ${{ !cancelled() && steps.client.outcome == 'success' && (matrix.platform == 'macos' || steps.simulator.outcome == 'success') }}
        timeout-minutes: 15
        run: bash react-client/compat/videojs10/safari/ci-server.sh "${{ matrix.platform }}" mse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-${{ matrix.platform }}-${{ matrix.os }}-results
          path: react-client/test-results/safari-${{ matrix.platform }}/

name: Safari HLS compatibility
on:
  push:
    branches:
      - 'migration/videojs-10-arm-check-c4ea768'
    paths:
      - 'react-client/**'
      - 'src/main/**'
      - '.github/workflows/videojs10-safari.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari:
    name: Safari managed media source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record the browser and runner versions
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          safaridriver --version
      - name: Prepare native media dependencies
        run: brew install ffmpeg libmediainfo
      - name: Build server and resolve the Java runtime classpath
        run: mvn -B -P testing-macos -DskipTests compile dependency:build-classpath -Dmdep.outputFile=target/safari-classpath
      - name: Build web client for the UMS web server
        id: client
        working-directory: react-client
        run: |
          node .yarn/releases/yarn-*.cjs install --immutable
          node .yarn/releases/yarn-*.cjs build
          node .yarn/releases/yarn-*.cjs build:videojs10
      - name: Play the sample through hls.js and ManagedMediaSource
        timeout-minutes: 15
        run: bash react-client/compat/videojs10/safari/ci-server.sh macos mse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-managed-${{ matrix.os }}
          path: react-client/test-results/safari-*/

name: Video.js 10 web player
on:
  push:
    branches: ['migration/videojs-10-hls-check']
    paths:
      - 'react-client/src/**'
      - 'src/main/java/net/pms/encoders/FFmpegHlsVideo.java'
      - 'src/main/java/net/pms/encoders/HlsHelper.java'
      - 'src/main/java/net/pms/network/webguiserver/servlets/PlayerApiServlet.java'
      - 'src/main/java/net/pms/parsers/MediaInfoParser.java'
      - 'react-client/compat/videojs10/audio/**'
      - 'react-client/compat/videojs10/create-fixture.sh'
      - 'react-client/package.json'
      - 'react-client/yarn.lock'
      - '.github/workflows/videojs10-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libmediainfo-dev pulseaudio pulseaudio-utils
      - name: Build UMS
        run: mvn -B -P testing -DskipTests compile dependency:build-classpath -Dmdep.outputFile=target/audio-classpath
      - name: Build the opt-in client and install browsers
        working-directory: react-client
        run: |
          node .yarn/releases/yarn-*.cjs install --immutable
          node .yarn/releases/yarn-*.cjs build:videojs10:app
          node node_modules/@playwright/test/cli.js install --with-deps --only-shell ${{ matrix.browser }}
      - name: Provide audio output for headless browsers
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ums_audio
          pactl set-default-sink ums_audio
      - name: Play audio, HLS and direct MP4 through both UMS entry points
        env:
          BROWSER: ${{ matrix.browser }}
          DEBUG: ${{ matrix.browser == 'webkit' && 'pw:browser' || '' }}
          GST_DEBUG: 'webkitmediaplayer:2,downloadbuffer:2,pulsesink:2'
        run: bash react-client/compat/videojs10/audio/run.sh --project="$BROWSER web interface" --project="$BROWSER standalone player"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: videojs10-audio-results-${{ matrix.browser }}
          path: react-client/test-results/videojs10-audio*
